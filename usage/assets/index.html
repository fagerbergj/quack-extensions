<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage</title>
<style>
  /* Fallback styles only - kept deliberately minimal and low-specificity so
     /assets/ext/v1/kit.css (linked below, loaded after) wins the cascade
     when it's present. If it 404s the page still reads fine on these alone. */
  body {
    margin: 0;
    padding: 1.5rem;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1b1f24;
    background: #f6f7f9;
  }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  h2 { font-size: 0.95rem; margin: 0 0 0.75rem; color: #444; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
  .range-select button {
    font: inherit;
    padding: 0.35rem 0.75rem;
    border: 1px solid #ccc;
    background: #fff;
    cursor: pointer;
    border-radius: 4px;
    margin-left: 0.25rem;
  }
  .range-select button[aria-pressed="true"] { background: #1b1f24; color: #fff; border-color: #1b1f24; }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; }
  .panel { background: #fff; border: 1px solid #e3e5e8; border-radius: 6px; padding: 1rem; }
  .panel-wide { grid-column: 1 / -1; }
  .chart-empty { color: #777; font-style: italic; padding: 1rem 0; }
  .chart-error { color: #a12a2a; padding: 1rem 0; }
  .bar-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.3rem 0; font-size: 0.85rem; }
  .bar-label { width: 9rem; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; background: #eef0f2; border-radius: 3px; height: 0.9rem; overflow: hidden; }
  .bar-fill { background: #3b6ea5; height: 100%; }
  .bar-value { flex: none; width: 5rem; text-align: right; font-variant-numeric: tabular-nums; }
  .stat-tile { font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; }
  .stat-sub { color: #666; font-size: 0.8rem; }
  svg.chart-svg { width: 100%; height: 140px; overflow: visible; }
</style>
<link rel="stylesheet" href="/assets/ext/v1/kit.css">
</head>
<body>
<div class="usage-app">
  <header>
    <h1>Usage</h1>
    <div class="range-select" role="group" aria-label="Time range" id="range-select">
      <button type="button" data-range="1h">1h</button>
      <button type="button" data-range="24h">24h</button>
      <button type="button" data-range="7d">7d</button>
      <button type="button" data-range="30d">30d</button>
    </div>
  </header>

  <section class="panels">
    <div class="panel" id="panel-tokens-model">
      <h2>Tokens by model</h2>
      <div class="chart" data-panel="tokens-model"></div>
    </div>
    <div class="panel" id="panel-tokens-source">
      <h2>Tokens by source</h2>
      <div class="chart" data-panel="tokens-source"></div>
    </div>
    <div class="panel" id="panel-tokens-agent">
      <h2>Tokens by agent</h2>
      <div class="chart" data-panel="tokens-agent"></div>
    </div>
    <div class="panel" id="panel-tokens-user">
      <h2>Tokens by user</h2>
      <div class="chart" data-panel="tokens-user"></div>
    </div>
    <div class="panel" id="panel-cache">
      <h2>Cache rate</h2>
      <div class="chart" data-panel="cache-rate"></div>
    </div>
    <div class="panel panel-wide" id="panel-cost">
      <h2>Cost</h2>
      <div class="chart" data-panel="cost"></div>
    </div>
  </section>
</div>
<script>
  window.__USAGE_CONFIG__ = {
    defaultRangeSeconds: {{.DefaultRangeSeconds}},
    tempoUrl: {{.TempoURL}}
  };
</script>
<script src="app.js"></script>
</body>
</html>
