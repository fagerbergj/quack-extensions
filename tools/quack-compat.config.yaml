# quack-compat's fixture: every extension enabled with placeholder values, so
# `quack server validate` runs each Factory. Nothing here is dialed.
providers:
  default:
    kind: openai
    endpoint: http://127.0.0.1:1/v1
    api_key: placeholder
orchestrator:
  provider: default
  model: m
models:
  m:
    provider: default
    role: worker
stores:
  default:
    kind: sqlite
    url: ${QUACK_COMPAT_TMP}/store.db
session:
  store: default
workspace:
  root: ${QUACK_COMPAT_TMP}/workspace

extensions:
  github:
    client_id: Iv1.placeholder
    private_key_path: ${QUACK_COMPAT_GITHUB_KEY}
    webhook_secret: ${QUACK_COMPAT_SECRET}
    mention: "/quack"
    allowed_users: [placeholder]
    triggers: [mention, pr_opened, label, issue_plan, issue_implement, merge, ci_fix, explain]
    run_timeout_minutes: 120
    labels:
      plan: "quack:plan"
      implement: "quack:implement"
      review: "quack-auto-review"
      merge: "quack:merge"
      partial_fix: "quack:partial-fix"
      fix: "quack:fix"
  noop:
    greeting: hello
  remarkable:
    base_url: http://127.0.0.1:1
    email: placeholder@example.com
    password: ${QUACK_COMPAT_SECRET}
  sleeper:
    default_user: placeholder
    default_league: "1"
    season: 2026
    snapshots: daily
    timezone: America/Chicago
  usage:
    prometheus_url: http://127.0.0.1:1
    tempo_url: http://127.0.0.1:2
    default_range: 24h
