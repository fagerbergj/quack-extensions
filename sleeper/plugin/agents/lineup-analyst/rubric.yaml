scale:
  min: 0
  max: 3
  pass: 2
notes: >
  Every criterion here is drawn from `research-r1-startsit.md` (R1) via the
  `sleeper:start-sit` skill - "what bad advice looks like" and the decision
  procedure it distills. A published threshold not in the skill/report must
  never be treated as fabricated on its own; check the report before scoring
  a citation down. When the skill itself says "no published number exists"
  for a case, an answer that says the same thing is fully grounded - it must
  not be penalized for lacking a number that does not exist.
criteria:
  every_slot_decided:
    definition: >
      Every starting slot, including the FLEX, gets an explicit start/sit
      call - no slot is left undecided or silently skipped.
    steps:
    - List every starting slot from the roster (including FLEX).
    - Check each slot has an explicit verdict (current player confirmed, or
      a named swap).
    - Check the FLEX specifically was decided by ranking all remaining
      RB/WR/TE candidates, not defaulted to "best RB not started."
    bands:
    - min: 3.0
      max: 3.0
      meaning: every slot including FLEX decided, with the FLEX ranked across all eligible remaining players.
    - min: 2.0
      max: 2.0
      meaning: every slot decided, but the FLEX reasoning defaults to "best RB/WR" rather than ranking the real candidate pool.
    - min: 1.0
      max: 1.0
      meaning: one slot is left undecided or ambiguous.
    - min: 0.0
      max: 0.0
      meaning: multiple slots undecided, or the FLEX is silently skipped.
    anchors:
    - quote
    - omission
  locks_respected:
    definition: >
      The answer accounts for Sleeper's per-game kickoff locks: it never
      recommends swapping a player whose game has already started, and it
      flags when a close call's window closes before more information
      (e.g. Thursday-only reporting, or the 90-minute inactive list) arrives.
    steps:
    - For every lock time, opponent, or game the answer names for a player,
      check it matches that player's own `game` in the session's
      `sleeper_roster`/`sleeper_matchup`/`sleeper_player` results - the time is
      its `kickoff_local`, and the opponent its `nfl_opponent`, written "vs X"
      when `is_home` is true and "at X" when false.
    - Check no recommended swap benches or brings in a player whose `game`
      is locked (`locked` true, or no kickoff and status in_game/complete).
    - For a Questionable/Doubtful player with a close kickoff, check the
      answer states the lock timing (per `start-sit`'s kickoff/timing
      guidance) rather than treating the decision as open-ended.
    bands:
    - min: 3.0
      max: 3.0
      meaning: locks are respected throughout, and lock timing is stated wherever it materially affects a close call.
    - min: 2.0
      max: 2.0
      meaning: locks are respected, but lock timing is not mentioned for a close call where it would help.
    - min: 1.0
      max: 1.0
      meaning: a recommendation is ambiguous about whether the swap is still actionable, or a game is written with home/away flipped.
    - min: 0.0
      max: 0.0
      meaning: a recommended swap benches or brings in a locked player, a stated lock time belongs to a different game than the player's, or the Thursday no-report gap is ignored.
    anchors:
    - quote
    - omission
  injury_practice_checked:
    definition: >
      Every starter's injury/practice status is checked and reflected in the
      call, using the report's play-rate data (`practice-report-semantics`)
      rather than treating a designation as binary.
    steps:
    - For each starter carrying a designation, check the answer names the
      designation and/or practice status.
    - Check the call reflects the relevant play rate (e.g. Friday DNP ≈ 29%,
      not an automatic bench) rather than a binary healthy/hurt read.
    - Check a Doubtful/Out player is not started without a stated reason.
    bands:
    - min: 3.0
      max: 3.0
      meaning: every starter's designation/practice status is checked and correctly weighted against the published play rates.
    - min: 2.0
      max: 2.0
      meaning: every designated starter is checked, but one call treats a designation more binary than the data supports.
    - min: 1.0
      max: 1.0
      meaning: a designated starter's status is checked but the play-rate context is missing.
    - min: 0.0
      max: 0.0
      meaning: a starter's injury/practice status is not checked, or a Doubtful/Out player starts with no stated reason.
    anchors:
    - quote
    - omission
  projections_cited:
    definition: >
      Start/sit calls that turn on scoring expectation cite the actual
      projection numbers pulled from `sleeper_player`/`sleeper_matchup`, not
      a vague "should score more."
    steps:
    - For each non-obvious call, check a projection number (or points-so-far
      figure) is cited.
    - Check the number traces to a tool call in this session, not an
      invented figure.
    bands:
    - min: 3.0
      max: 3.0
      meaning: every non-obvious call cites the specific projection numbers used.
    - min: 2.0
      max: 2.0
      meaning: most calls cite numbers; one close call states a verdict with no number behind it.
    - min: 1.0
      max: 1.0
      meaning: several calls lack the projection numbers that would justify them.
    - min: 0.0
      max: 0.0
      meaning: verdicts are stated with no supporting numbers, or a cited number does not match the tool data.
    anchors:
    - quote
    - omission
  opponent_considered:
    definition: >
      Matchup/opponent context is used only within the bounds the report
      supports - a tiebreaker for close calls, never a reason to bench a
      clearly-better healthy player.
    steps:
    - Check a close call between similarly-projected players cites matchup
      as the deciding factor when relevant.
    - Check no call benches a clearly-better, healthy player for a
      clearly-worse one on matchup alone.
    bands:
    - min: 3.0
      max: 3.0
      meaning: matchup is used correctly as a bounded tiebreaker, never to override a clear talent/health gap.
    - min: 2.0
      max: 2.0
      meaning: matchup is used correctly, but one close call would have benefited from citing it and didn't.
    - min: 1.0
      max: 1.0
      meaning: matchup is over-weighted in one call without being decisive to a bench-the-better-player error.
    - min: 0.0
      max: 0.0
      meaning: a clearly-better healthy player is benched for a worse one on matchup alone.
    anchors:
    - quote
    - omission
  no_hedged_pick:
    definition: >
      Every call names an action - a start, a sit, or "no change" - never
      "either could work" left without a pick.
    steps:
    - Scan every verdict for a genuine pick vs. a hedge.
    - Check uncertainty is expressed as a confidence number or a named
      contingency, not as an unresolved "your call."
    bands:
    - min: 3.0
      max: 3.0
      meaning: every call names an action; uncertainty is expressed as confidence or a named contingency, never as a hedge.
    - min: 2.0
      max: 2.0
      meaning: every call names an action, but one close call's confidence framing is thin.
    - min: 1.0
      max: 1.0
      meaning: one call is left as an unresolved hedge.
    - min: 0.0
      max: 0.0
      meaning: multiple calls are hedged with no pick made.
    anchors:
    - quote
    - omission
  artifact_delivered:
    definition: >
      The round's deliverable is a `lineup` artifact written via
      write_artifact, not just a lineup card described in the chat reply -
      it parses as JSON and carries the schema's required top-level fields
      (`week`, `team`, a non-empty `starters` array).
    steps:
    - Check a `lineup` artifact exists for this round (list_artifacts/
      read_artifact), separate from the reply's own text.
    - Parse the artifact's content as JSON.
    - Check `week`, `team`, and a non-empty `starters` array are present.
    bands:
    - min: 3.0
      max: 3.0
      meaning: a `lineup` artifact exists, parses as JSON, and every required top-level field is present.
    - min: 2.0
      max: 2.0
      meaning: the artifact exists and parses, but one required field is missing or empty.
    - min: 1.0
      max: 1.0
      meaning: no artifact was written this round - the lineup card only exists as prose in the reply.
    - min: 0.0
      max: 0.0
      meaning: the round's content does not parse as JSON at all, or no lineup content exists anywhere.
    anchors:
    - quote
    - omission
  outside_news_for_close_calls:
    definition: >
      Sleeper's own projection and injury/practice fields lag practice-report
      and beat-writer news, so every close call - a Questionable or
      limited-practice starter, or a bench player whose projection sits
      within the flex tie-break gap of the starter's - checks recent news
      and cites it inline as a markdown link.
    guidance: >
      If a round genuinely has no close call (no Questionable/limited-
      practice starter and no bench-vs-starter gap under the flex tie-break
      threshold), score 3 - there is nothing to check, not a missed check.
    steps:
    - List every close call - a starter carrying a Questionable/Doubtful
      designation or a Friday-limited practice report, and any slot where a
      bench player's projection sits within the flex tie-break gap of the
      starter's.
    - For each, check the `why` (or the reply) cites a markdown link to a
      news source, not just the Sleeper designation restated.
    - Check the cited link is one a web_search/web_fetch call in this
      session actually returned, not invented.
    bands:
    - min: 3.0
      max: 3.0
      meaning: every close call cites a markdown-linked news source actually returned by a session tool call.
    - min: 2.0
      max: 2.0
      meaning: every close call cites outside news, but one link cannot be traced to a session tool call.
    - min: 1.0
      max: 1.0
      meaning: one close call has no outside-news citation.
    - min: 0.0
      max: 0.0
      meaning: multiple close calls rest on Sleeper's fields alone, or a cited link is fabricated.
    anchors:
    - quote
    - omission
  weather_checked_for_outdoor_close_calls:
    definition: >
      Every close call in an outdoor game checks that game's forecast with
      the `weather` tool and applies it only at the skill's extremes, as a
      tiebreaker; a call the forecast moved says so in its `why` with the
      forecast numbers. Outdoor means the player's `game.roof` is
      `outdoor` after the Note-column overrides in `stadiums.md` (SoFi
      counts as a dome, Wembley as outdoor).
    guidance: >
      A close call where either player's game is locked, or whose slot has
      no rostered alternative (e.g. the only K), is exempt, as is a game
      already played or beyond the forecast horizon, and a
      `weather` call that errored or came back out of range counts as
      checked when the answer acknowledges it. If no close call involves an
      outdoor game, score 3 - there is nothing to check. One call per game
      covers every player in it.
    steps:
    - List every close call (as in outside_news_for_close_calls) and its
      game; keep the outdoor, non-exempt ones (both players' games unlocked,
      a real alternative, not past the horizon).
    - For each such game, check a `weather` call in this session covers its
      venue and kickoff (or errored and the answer says so).
    - Check each `weather` call used `stadiums.md`'s coordinates for that
      venue (or, for a venue missing there, coordinates a `web_search`
      returned, as `stadiums.md` allows), and none was made for a non-close
      call, a locked game, or an exempt close call.
    - Read the artifact and the chat reply. Check any call that cites weather
      matches the tool's numbers, that
      weather below the skill's extremes did not flip a call, and that
      weather is never mentioned for a call it did not move.
    bands:
    - min: 3.0
      max: 3.0
      meaning: every outdoor close-call game is checked, and weather moves a call only at the skill's extremes, stated with its numbers.
    - min: 2.0
      max: 2.0
      meaning: every outdoor close-call game is checked, but a call weather moved lacks the forecast numbers, or weather was checked for a non-close call, a locked game, or an exempt close call.
    - min: 1.0
      max: 1.0
      meaning: exactly one outdoor close-call game is unchecked, mild weather tipped a call, or a forecast is mentioned (including "no adjustment needed") for a call it did not move.
    - min: 0.0
      max: 0.0
      meaning: two or more outdoor close-call games are unchecked, or a cited forecast matches no weather tool result.
    anchors:
    - quote
    - omission
  summary_states_changes:
    definition: >
      The artifact's `summary` is at most two sentences and names every
      change from the starters `sleeper_roster`/`sleeper_matchup` reported
      as starting this week - "Start X over Y" per change - or states there
      are no changes.
    steps:
    - Read the current starters `sleeper_roster`/`sleeper_matchup` reported
      for this week (the session's own tool calls, not the artifact's
      recommended starters).
    - Diff those against the artifact's `starters` array to find every real
      change.
    - Check the `summary` names each one as "Start X over Y" (or equivalent
      explicit phrasing) in no more than two sentences.
    bands:
    - min: 3.0
      max: 3.0
      meaning: summary is at most two sentences and names every real change as start X over Y, or correctly says no changes.
    - min: 2.0
      max: 2.0
      meaning: every change is named, but the summary runs longer than two sentences or names one loosely.
    - min: 1.0
      max: 1.0
      meaning: one real change is missing from the summary.
    - min: 0.0
      max: 0.0
      meaning: the summary lists no changes while the starters array shows real ones, or invents a change that didn't happen.
    anchors:
    - quote
    - omission
  why_is_brief:
    definition: >
      Every `starters`/`bench`/`reserve` row's `why` is one short sentence,
      about 140 characters or fewer - a decision-first line, not a
      paragraph.
    steps:
    - Read every `why` field across `starters`, `bench`, and `reserve`.
    - Check each is roughly one sentence and about 140 visible characters or under, not counting a markdown link's URL.
    bands:
    - min: 3.0
      max: 3.0
      meaning: every why across starters/bench/reserve is one short sentence, about 140 visible characters or under (a link's URL does not count).
    - min: 2.0
      max: 2.0
      meaning: all but one why meets the length bar; the outlier is still a single sentence.
    - min: 1.0
      max: 1.0
      meaning: several why fields run long, or one is a multi-sentence paragraph.
    - min: 0.0
      max: 0.0
      meaning: why fields are consistently paragraph-length across the artifact.
    anchors:
    - quote
