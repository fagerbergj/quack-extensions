scale:
  min: 0
  max: 3
  pass: 2
criteria:
  catches_real_issues:
    definition: >
      The review surfaces the change's actual defects - the correctness, security, and missing-test problems that matter - rather than only cosmetic ones, and presents them as findings for a human deciding whether to merge, not a transcript of the reviewer's own process. It never turns an environment-specific failure into a code-quality concern. Judge against what the change actually contains, not against an imagined ideal review. "The review" is the staged record (stage_review_comment/stage_review, or the structured tail) - reflected here via the staged verdict/takeaway/notes and findings sections - never the chat-visible reply; a one-line reply confirming what was staged is correct, not a gap.
    steps:
    - From the diff, identify the genuine problems in the change (bugs, unhandled edge cases, security exposure, new behavior with no test).
    - Check whether the review found each, or missed a significant one while spending its attention on trivia.
    - Check `notes` (the review's only free-prose field) for process narration - a "What I ran"/"What I checked" list of commands (`git diff`, `go test`, `gofmt`, `go vet`, install steps) that belongs in `verified` (one structured item per check performed) instead of prose.
    - "Check every reported test/build failure or \"pre-existing issue\": is it tied to the diff, or is it a sandbox/toolchain/network gap (missing `make`, no network, stale cache) that the PR's own green CI contradicts? A failure that doesn't reproduce in CI and isn't caused by the diff is not a legitimate finding."
    bands:
    - min: 3.0
      max: 3.0
      meaning: the review catches the change's real, impactful issues (or correctly finds few, because the change is clean); `notes` carries no process narration, and no environmental-only failure is reported as a concern.
    - min: 2.0
      max: 2.0
      meaning: it catches the change's real issues, but `notes` carries a "What I ran"/"What I checked" list that belongs in `verified` instead, or one reported failure is questionable but not clearly environmental - the substance is right, the packaging has a cosmetic flaw.
    - min: 1.0
      max: 1.0
      meaning: it misses one material issue, or buries a real finding deep among minor points where a reader could miss it.
    - min: 0.0
      max: 0.0
      meaning: it misses the change's central defect, reports only cosmetic findings while a real bug/security/test gap goes unmentioned, or reports a sandbox/environment failure as a code concern on a PR whose CI is green.
    anchors:
    - quote
    - omission
  claims_grounded:
    definition: >
      Every finding the review makes is grounded in code the reviewer actually read - it points at a real file/line/behavior, not an invented defect.
    guidance: >
      This is the fabrication check for a review: asserting "this function swallows the error" about code the reviewer never opened is as disqualifying as an invented citation.
    steps:
    - List the review's substantive findings (each blocking issue, suggestion, and factual claim about the code's behavior).
    - "For each, check it against the ledger's read/diff samples and, if you can, the file itself: does the cited code actually behave the way the finding says?"
    - A finding about code contradicted by the file, or asserting behavior in a file the reviewer never read, is fabrication - score 0.
    bands:
    - min: 3.0
      max: 3.0
      meaning: every substantive finding points at code the reviewer actually read, and matches what that code does.
    - min: 2.0
      max: 2.0
      meaning: every finding is grounded, but one is phrased more definitively than the read strictly supports (a reasonable inference stated as flat fact rather than hedged) without being wrong.
    - min: 1.0
      max: 1.0
      meaning: one finding rests on an assumption not checked against the file, though nothing it says is actually contradicted by the code.
    - min: 0.0
      max: 0.0
      meaning: a finding is contradicted by the file it cites, or asserts behavior in a file the reviewer never read.
    anchors:
    - quote
    - omission
  constructive_actionable:
    definition: >
      Each finding explains the underlying *why* (risk, principle, or benefit) rather than only asserting "this is wrong", so it's actionable. A finding that proposes a SPECIFIC code change (a rename, an extraction, a different implementation) shows that code in a fenced block with a language tag rather than only describing it in prose. A PURELY OBSERVATIONAL finding - a question, a naming nit with no proposed name - proposes nothing concrete and needs no code block.
    steps:
    - Check findings explain the underlying reason (risk/principle/benefit), not only "this is wrong".
    - For each finding that proposes a specific code change, check whether it supplies that code in a fenced code block, rather than only describing the change in prose.
    bands:
    - min: 3.0
      max: 3.0
      meaning: every finding explains its why, and every finding proposing specific code supplies it in a fenced block.
    - min: 2.0
      max: 2.0
      meaning: every finding explains its why and every proposed change carries code, but one explanation is thinner than the rest (states the risk without the reasoning behind it) without being absent.
    - min: 1.0
      max: 1.0
      meaning: actionable but terse (some findings state what without why), or a finding proposes a specific change in prose without the code to back it.
    - min: 0.0
      max: 0.0
      meaning: findings are unactionable ("this is bad") with no reasoning at all.
    anchors:
    - quote
    - omission
  delivery_checked:
    definition: >
      The review checks the change against what it set out to deliver - each acceptance item in the linked issue (artifact `linked-issue-<n>`) and each thing the pull request description says it does - and against the existing siblings of any pattern it extends. An item the diff neither delivers nor defers to a linked follow-up is reported as a `blocking:` finding, not omitted and not filed as a note.
    guidance: >
      Build the list yourself before reading the review's. Open the linked issue and the pull request with `read_artifact`; where the diff adds another instance of an existing pattern (an agent bundle, a handler, a plugin), open one sibling in the repository and list the parts it carries. Then compare. A review can be accurate line by line and still approve half a feature, and this criterion is where that shows. A change with no linked issue whose description claims nothing beyond the diff has nothing to miss: score it 3.
    steps:
    - List the delivery items - the acceptance items in each `linked-issue-<n>` artifact and the claims in the pull request description.
    - For each item, find it in the diff, or find where the change defers it to a linked follow-up. Note every item that is neither.
    - Where the diff adds an instance of an existing pattern, open a sibling and list the parts the new instance lacks.
    - Check the review reports each gap you found as a `blocking:` finding, and that `verified` accounts for delivery in one item - unmet and deferred items named, met ones folded into a count (the field is capped at 8 items) - rather than restating the description.
    bands:
    - min: 3.0
      max: 3.0
      meaning: every delivery item and sibling part is accounted for, and each gap is a blocking finding - or there was nothing to miss.
    - min: 2.0
      max: 2.0
      meaning: every gap is reported as a blocking finding, but `verified` carries no delivery item naming what is unmet or deferred.
    - min: 1.0
      max: 1.0
      meaning: one gap is missing from the findings, or is filed as a note or a suggestion.
    - min: 0.0
      max: 0.0
      meaning: the review approves while an acceptance item or a sibling's part is absent and unreported.
    anchors:
    - quote
    - omission
    require_fix_on_fail: true
  severity_grounded:
    definition: >
      Every severity label rests on something objective, and the review says what. A finding supported only by the reviewer's preference is a nit:, however strongly it is argued. blocking: requires one of six anchors: defect (concrete inputs or state produce wrong output, a crash, or data loss - whether the producer is code, a prompt, a schema or a config file), delivery (something the change set out to deliver is absent and not deferred to a linked follow-up, or what it produces does not match what consumes it), security, design (a NAMED principle violated, not "I'd have done it differently"), scope (the change does what its task never asked for), or tests (new behaviour with no test, or a test that passes while what it claims to cover is broken).
    guidance: >
      Score whether each label is supported, not whether you would have chosen it. Two reviewers can reasonably weigh the same finding differently; neither may block on taste. The style guide and the linter are the authority on style, and out-of-scope observations belong in their own issue rather than gating this change.
    steps:
    - For each `blocking:` finding, name which of the six anchors it claims, then open the code and check the anchor actually holds. An anchor asserted but not borne out by the code means the label is wrong, however serious the finding sounds.
    - For each `suggestion:`/`nit:`/note, check it is not one of the six mislabelled downward. A defect soft-pedalled into a suggestion is the more damaging error, because it ships.
    - Read each non-blocking finding's own words. One that says what breaks ("renders as empty rows", "the key the page reads is never written") names wrong output and carries the defect or delivery anchor, whatever kind of file it sits in.
    - "Check nothing gates the merge on preference: is any `blocking:` finding one the author could reasonably decline at no objective cost?"
    bands:
    - min: 3.0
      max: 3.0
      meaning: every label carries a supported anchor; nothing blocks on taste.
    - min: 2.0
      max: 2.0
      meaning: every label is supported, but one anchor is stated tersely (names the category without spelling out why it holds) rather than left unsupported.
    - min: 1.0
      max: 1.0
      meaning: one label unsupported, or one defect soft-pedalled below `blocking:`, or one preference treated as blocking.
    - min: 0.0
      max: 0.0
      meaning: labels are preference-driven, or a defect/security finding is labelled below `blocking:` while style gates the merge.
    anchors:
    - quote
    - omission
  structured_verdict:
    definition: >
      The review's takeaway is a scannable, one-sentence read consistent with its own findings and verdict. Severity grouping in the Highlights table (blocking → suggestions) is generated by the renderer from the findings' own labels, not something the model controls - do not score it here. The staged verdict (via `stage_review`'s `event`, or the answer's `VERDICT:` tail) must tell the same story as the findings' own severity labels. Grade the STAGED takeaway/verified/notes and findings, not the chat-visible reply - a worker that stages the review and replies with one confirmation line has done this correctly, not omitted the takeaway.
    guidance: >
      The verdict is STRUCTURED DATA: your prompt surfaces the resolved value as "Staged review verdict: <event>" when one is staged. Three verdicts, three levels of confidence: any surviving `blocking:` ⇒ `request_changes`; else any unresolved `question:` ⇒ `comment`; else ⇒ `approve`, nits and suggestions okay. `comment` is legitimate ONLY when an unresolved `question:` stands, or the review states verification it could not finish - not as a way to avoid committing to a verdict with nothing unresolved behind it.
    steps:
    - Check the review has a one-sentence takeaway a reader could act on in fifteen seconds.
    - Read the staged verdict provided to you and check it is present.
    - Cross-check every finding's OWN severity label against the overall verdict - the two must tell the same story. A finding labeled `blocking:` sitting alongside an `approve` verdict is a direct self-contradiction, regardless of whether the underlying issue actually warrants blocking; so is a `request_changes` verdict backed by nothing but `nit:`/`suggestion:` findings. Reason about it, do not pattern-match on the label text alone.
    bands:
    - min: 3.0
      max: 3.0
      meaning: clear one-sentence takeaway, a present and consistent staged verdict (including an explicit approve on a clean change).
    - min: 2.0
      max: 2.0
      meaning: a present, consistent staged verdict, but the takeaway is present and accurate while reading more like a findings recap than a fifteen-second read.
    - min: 1.0
      max: 1.0
      meaning: mostly clear but missing the takeaway entirely, or the staged verdict slightly mismatches the findings.
    - min: 0.0
      max: 0.0
      meaning: no takeaway, no staged verdict at all, a staged verdict that contradicts the findings (approves over an unresolved blocking issue, or ANY finding is labeled blocking/security-severity while the verdict is `approve`, or `request_changes` is staged over findings that are all nits/suggestions), or a clean review - empty or non-blocking findings, verification the review calls complete - resolved to `comment` instead of `approve`.
    anchors:
    - quote
    - omission
  verification_over_assertion:
    definition: >
      The review verified the change's claims by reading - the diff, the code and tests it touches, CI's result - rather than trusting the description, and ran something only where a claim was too large or surprising for reading to settle.
    guidance: >
      Reading is the default, not a lesser substitute for running: a review that reads the tests, confirms they'd fail if the code were broken, and reads CI's result has fully verified. Running is warranted, not extra credit, only when the claim genuinely can't be settled by reading - a performance number, "this fixes the race", behaviour with no test. A rename, docs, comment, or config change is verified by reading alone; running one is not a bonus. Score 3 is not a consolation prize withheld for extra caution: if your own reasoning says every run was warranted and stated, or that reading alone settled the claims, that reasoning describes the top band - score it 3, not lower.
    steps:
    - Check whether the review engaged with the change's stated intent and confirmed the diff actually delivers it, by reading the code and tests rather than restating the description.
    - Check whether it read the tests closely enough to say whether they'd fail if the code were broken, and read CI's result rather than ignoring or re-deriving it.
    - Where the review ran something, check the claim actually warranted it and the review says so; running a docs/config/rename change, or running without saying why, is not rewarded here.
    bands:
    - min: 3.0
      max: 3.0
      meaning: the review reads the tests and CI closely enough to confirm the claim, and any run it did was warranted and stated as such.
    - min: 2.0
      max: 2.0
      meaning: the review verified the claim by reading code, tests, and CI, but ran one thing the claim didn't strictly warrant without saying why - extra diligence, not a shortcut.
    - min: 1.0
      max: 1.0
      meaning: it trusted the description on one axis (code or tests or CI) while verifying the others.
    - min: 0.0
      max: 0.0
      meaning: "it trusted the description: accepted the claim, the tests' presence, or CI's result without reading closely enough to confirm any of them."
    anchors:
    - quote
    require_fix_on_fail: true
