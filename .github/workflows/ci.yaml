name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [sdk, noop, remarkable, usage, github]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - run: gofmt -l . | tee /dev/stderr | (! read -r)
      - run: go vet ./...
      - run: go test ./...

  go-slop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        module: [sdk, noop, remarkable, usage, github]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      # Pinned: an unpinned @latest gate can shift findings (or break the
      # config schema) outside the PR author's control; key carries the version.
      - name: cache golangci-lint
        uses: actions/cache@v6
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-2.13.2-${{ runner.os }}-${{ hashFiles('.golangci.yml') }}
      - name: install golangci-lint
        run: |
          [ -x "$HOME/go/bin/golangci-lint" ] || \
            GOTOOLCHAIN=local go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: slop gate (changed code only, ${{ matrix.module }})
        env:
          SLOP_BASE: ${{ github.event.pull_request.base.sha }}
        working-directory: ${{ matrix.module }}
        run: |
          # --max-same-issues=0: the default cap of 3 per identical message
          # would let a PR ship a 4th unchecked clone of the same kind.
          $(go env GOPATH)/bin/golangci-lint run --new-from-rev "$SLOP_BASE" --max-same-issues=0 --max-issues-per-linter=0 ./...
      # One repo-wide hunk-aware CC/comment gate; run once (the github leg)
      # - sloplint scans every module from the repo root it is handed.
      - name: slop gate (sloplint CC + comment runs, changed code only)
        if: matrix.module == 'github'
        env:
          SLOP_BASE: ${{ github.event.pull_request.base.sha }}
        run: go run -C tools/sloplint . diff "$SLOP_BASE" "$GITHUB_WORKSPACE"
