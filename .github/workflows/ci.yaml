name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [sdk, noop, remarkable, usage, github, sleeper]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - run: gofmt -l . | tee /dev/stderr | (! read -r)
      - run: go vet ./...
      - run: go test ./...

  go-slop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        module: [sdk, noop, remarkable, usage, github, sleeper]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      # Pinned: an unpinned @latest gate can shift findings (or break the
      # config schema) outside the PR author's control; key carries the version.
      - name: cache golangci-lint
        uses: actions/cache@v6
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-2.13.2-${{ runner.os }}-${{ hashFiles('.golangci.yml') }}
      - name: install golangci-lint
        run: |
          [ -x "$HOME/go/bin/golangci-lint" ] || \
            GOTOOLCHAIN=local go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: slop gate (changed code only, ${{ matrix.module }})
        env:
          SLOP_BASE: ${{ github.event.pull_request.base.sha }}
        working-directory: ${{ matrix.module }}
        run: |
          # --max-same-issues=0: the default cap of 3 per identical message
          # would let a PR ship a 4th unchecked clone of the same kind.
          $(go env GOPATH)/bin/golangci-lint run --new-from-rev "$SLOP_BASE" --max-same-issues=0 --max-issues-per-linter=0 ./...
      # Changed-line coverage gate: new code ships covered (>=70%).
      - name: coverage gate (changed code only, ${{ matrix.module }})
        env:
          SLOP_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          OUT=$(go run -C tools/coverdiff . diff "$SLOP_BASE" "$GITHUB_WORKSPACE" "${{ matrix.module }}" 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$RC" -ne 0 ]; then
            # The job log carries the full suite output; the PR gets the
            # verdict and the uncovered lines.
            {
              echo "### Coverage gate: changed lines below the 70% floor (module: ${{ matrix.module }})"
              echo ""
              echo '```'
              printf '%s\n' "$OUT" | grep -E '^coverdiff:|^  uncovered:'
              echo '```'
              echo ""
              echo "Cover the changed lines above (or split the change)."
            } | gh pr comment "${{ github.event.pull_request.number }}" --body-file -
            exit "$RC"
          fi
      # One repo-wide hunk-aware CC/comment gate; run once (the github leg)
      # - sloplint scans every module from the repo root it is handed.
      - name: slop gate (sloplint CC + comment runs, changed code only)
        if: matrix.module == 'github'
        env:
          SLOP_BASE: ${{ github.event.pull_request.base.sha }}
        run: go run -C tools/sloplint . diff "$SLOP_BASE" "$GITHUB_WORKSPACE"
      # The gate's own tests (window boundary, wiring) run in CI, not
      # just locally - a broken cc-allow silently un-gates every PR.
      - name: sloplint tests
        if: matrix.module == 'github'
        run: go -C tools/sloplint test .
      # Same for coverdiff - a broken key alignment is a silent no-op
      # gate (every PR passes), the tests pin it.
      - name: coverdiff tests
        if: matrix.module == 'github'
        run: go -C tools/coverdiff test .

  sleeper-storybook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sleeper/ui/storybook
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sleeper/ui/storybook/package-lock.json
      - run: npm ci
      - run: npm run validate-schemas
      - run: npm run security-check
      # No --with-deps: it runs apt-get update, which fails whenever Google's
      # chrome apt mirror is inconsistent, and the runner already ships every
      # library Chromium needs.
      - run: npx playwright install chromium
      - run: npm run render-check
